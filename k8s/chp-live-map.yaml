  namespace: chp-live-map
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: chp-live-map-wildweb
  template:
    metadata:
      labels:
        app: chp-live-map-wildweb
    spec:
      containers:
        - name: wildweb
          image: cajaks2/chp-live-map:0.1.191
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /app/scrape_wildweb_incidents.py
          ports:
            - name: metrics
              containerPort: 8082
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chp-live-map-db
                  key: DATABASE_URL
            - name: SERVICE_VERSION
              value: "0.1.191"
            - name: WILDWEB_INTERVAL_SECONDS
              value: "120"
            - name: WILDWEB_MAX_AGE_HOURS
              value: "72"
            - name: WILDWEB_USER_AGENT
              value: "crestmap-wildweb/0.1 (+https://crestmap.us/)"
            - name: WILDWEB_PUSH_NOTIFICATIONS
              value: "true"
            - name: WILDWEB_METRICS_HOST
              value: 0.0.0.0
            - name: WILDWEB_METRICS_PORT
              value: "8082"
            - name: PUBLIC_URL
              value: https://crestmap.us/
            - name: VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: chp-live-map-db
                  key: VAPID_PRIVATE_KEY
                  optional: true
            - name: VAPID_SUBJECT
              value: https://crestmap.us
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: chp-live-map-wildweb
  namespace: chp-live-map
spec:
  type: ClusterIP
  selector:
    app: chp-live-map-wildweb
  ports:
    - name: metrics
      port: 8082
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chp-live-map-aircraft
  namespace: chp-live-map
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: chp-live-map-aircraft
  template:
    metadata:
      labels:
        app: chp-live-map-aircraft
    spec:
      containers:
        - name: aircraft
          image: cajaks2/chp-live-map:0.1.191
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /app/aircraft_tracking.py
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chp-live-map-db
                  key: DATABASE_URL
            - name: SERVICE_VERSION
              value: "0.1.191"
            - name: OPENSKY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: chp-live-map-db
                  key: OPENSKY_CLIENT_ID
            - name: OPENSKY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chp-live-map-db
                  key: OPENSKY_CLIENT_SECRET
            - name: AIRCRAFT_POLL_SECONDS
              value: "30"
            - name: AIRCRAFT_RETENTION_HOURS
              value: "24"
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chp-live-map-web
  namespace: chp-live-map
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chp-live-map-web
  template:
    metadata:
      labels:
        app: chp-live-map-web
    spec:
      containers:
        - name: web
          image: cajaks2/chp-live-map:0.1.191
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - exec gunicorn app:app -k uvicorn.workers.UvicornWorker --workers ${WEB_WORKERS:-1} --bind 0.0.0.0:${HTTP_PORT:-8080} --access-logfile /dev/null --error-logfile -
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chp-live-map-db
                  key: DATABASE_URL
            - name: MAP_HOURS
              value: "72"
            - name: HTTP_PORT
              value: "8080"
            - name: SERVICE_VERSION
              value: "0.1.191"
            - name: BASE_PATH
              value: /
            - name: PUBLIC_URL
              value: https://crestmap.us/
            - name: GOOGLE_ANALYTICS_ID
              value: ""
            - name: VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: chp-live-map-db
                  key: VAPID_PUBLIC_KEY
                  optional: true
            - name: AIRCRAFT_TRACKING_ENABLED
              value: "true"
            - name: AIRCRAFT_DISPLAY_DELAY_SECONDS
              value: "60"
            - name: AIRCRAFT_MAX_AGE_SECONDS
              value: "900"
            - name: AIRCRAFT_TRAIL_AGE_SECONDS
              value: "1800"
            - name: WEB_WORKERS
              value: "1"
            - name: COMMENT_AUTO_APPROVE
              value: "true"
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: chp-live-map-db
                  key: ADMIN_USERNAME
                  optional: true
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chp-live-map-db
                  key: ADMIN_PASSWORD
                  optional: true
            - name: R2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: chp-live-map-db
                  key: R2_ACCOUNT_ID
                  optional: true
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: chp-live-map-db
                  key: R2_ACCESS_KEY_ID
                  optional: true
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: chp-live-map-db
                  key: R2_SECRET_ACCESS_KEY
                  optional: true
            - name: R2_UPLOAD_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: chp-live-map-db
                  key: R2_UPLOAD_TOKEN_SECRET
                  optional: true
            - name: R2_BUCKET
              value: crestmap-media
            - name: ADMIN_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: chp-live-map-db
                  key: ADMIN_SESSION_SECRET
                  optional: true
            - name: ADMIN_SESSION_HOURS
              value: "8"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: chp-live-map
  namespace: chp-live-map
spec:
  type: ClusterIP
  selector:
    app: chp-live-map-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chp-live-map
  namespace: chp-live-map
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: crestmap.us
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chp-live-map
                port:
                  number: 80
  tls:
    - hosts:
        - crestmap.us
      secretName: crestmap-us-tls
