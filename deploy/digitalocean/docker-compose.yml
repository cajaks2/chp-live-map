services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ${IMAGE_REPO:-cajaks2/chp-live-map}:${VERSION:-0.1.214}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MAP_HOURS: "72"
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
      BASE_PATH: /
      PUBLIC_URL: https://crestmap.us/
      SERVICE_VERSION: ${VERSION:-0.1.214}
      OPEN_METEO_API_KEY: ${OPEN_METEO_API_KEY:-}
      GOOGLE_ANALYTICS_ID: ${GOOGLE_ANALYTICS_ID:-}
      DATABASE_POOL_MIN: ${DATABASE_POOL_MIN:-1}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
      WEB_WORKERS: ${WEB_WORKERS:-1}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-8}
      ADMIN_SESSION_MAX_HOURS: ${ADMIN_SESSION_MAX_HOURS:-24}
      ADMIN_REMEMBER_DAYS: ${ADMIN_REMEMBER_DAYS:-30}
      COMMENT_AUTO_APPROVE: ${COMMENT_AUTO_APPROVE:-true}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-crestmap-media}
      R2_UPLOAD_TOKEN_SECRET: ${R2_UPLOAD_TOKEN_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      AIRCRAFT_TRACKING_ENABLED: "true"
      AIRCRAFT_DISPLAY_DELAY_SECONDS: ${AIRCRAFT_DISPLAY_DELAY_SECONDS:-60}
      AIRCRAFT_MAX_AGE_SECONDS: ${AIRCRAFT_MAX_AGE_SECONDS:-900}
      AIRCRAFT_TRAIL_AGE_SECONDS: ${AIRCRAFT_TRAIL_AGE_SECONDS:-1800}
    ports:
      - "127.0.0.1:8080:8080"

  scrape:
    image: ${IMAGE_REPO:-cajaks2/chp-live-map}:${VERSION:-0.1.214}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SERVICE_VERSION: ${VERSION:-0.1.214}
      CHP_SOURCE_MODE: ${CHP_SOURCE_MODE:-xml}
      CHP_XML_MAX_AGE_MINUTES: ${CHP_XML_MAX_AGE_MINUTES:-5}
      CHP_XML_SHADOW_COMPARE: ${CHP_XML_SHADOW_COMPARE:-false}
      CHP_CONTACT_EMAIL: ${CHP_CONTACT_EMAIL:-}
      PUBLIC_URL: https://crestmap.us/
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-https://crestmap.us}
      SCRAPER_METRICS_HOST: 0.0.0.0
      SCRAPER_METRICS_PORT: "8081"
    ports:
      - "127.0.0.1:8081:8081"
    command:
      - python3
      - /app/scrape_chp_traffic.py
      - --interval
      - "60"
      - --detail-refresh-minutes
      - "3"

  wildweb:
    image: ${IMAGE_REPO:-cajaks2/chp-live-map}:${VERSION:-0.1.214}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SERVICE_VERSION: ${VERSION:-0.1.214}
      WILDWEB_INTERVAL_SECONDS: ${WILDWEB_INTERVAL_SECONDS:-120}
      WILDWEB_MAX_AGE_HOURS: ${WILDWEB_MAX_AGE_HOURS:-72}
      WILDWEB_USER_AGENT: ${WILDWEB_USER_AGENT:-crestmap-wildweb/0.1 (+https://crestmap.us/)}
      WILDWEB_PUSH_NOTIFICATIONS: ${WILDWEB_PUSH_NOTIFICATIONS:-true}
      WILDWEB_METRICS_HOST: 0.0.0.0
      WILDWEB_METRICS_PORT: "8082"
      PUBLIC_URL: https://crestmap.us/
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-https://crestmap.us}
    ports:
      - "127.0.0.1:8082:8082"
    command:
      - python3
      - /app/scrape_wildweb_incidents.py

  aircraft:
    image: ${IMAGE_REPO:-cajaks2/chp-live-map}:${VERSION:-0.1.214}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SERVICE_VERSION: ${VERSION:-0.1.214}
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
      AIRCRAFT_POLL_SECONDS: ${AIRCRAFT_POLL_SECONDS:-30}
      AIRCRAFT_RETENTION_HOURS: ${AIRCRAFT_RETENTION_HOURS:-24}
    command:
      - python3
      - /app/aircraft_tracking.py

  postgres-backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups/postgres:/backups
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /backups
        while true; do
          ts=$$(date -u +%Y%m%dT%H%M%SZ)
          tmp="/backups/$${POSTGRES_DB}-$${ts}.dump.tmp"
          out="/backups/$${POSTGRES_DB}-$${ts}.dump"
          pg_dump -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -Fc --clean --if-exists > "$${tmp}"
          mv "$${tmp}" "$${out}"
          find /backups -type f -name "$${POSTGRES_DB}-*.dump" -mtime +"$${BACKUP_RETENTION_DAYS}" -delete
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done

volumes:
  postgres-data:
